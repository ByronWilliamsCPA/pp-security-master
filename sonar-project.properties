# Bound to the byronwilliamscpa SonarCloud org since the 2026-06-19 org transfer.
# The org key is lowercase; the project key keeps the GitHub org's capitals.
# Keep in sync with the with: block in .github/workflows/sonarcloud.yml.
sonar.organization=byronwilliamscpa
sonar.projectKey=ByronWilliamsCPA_pp-security-master
sonar.sources=src
# Versions the SOURCE supports. requires-python is ">=3.11" with no ceiling, so this
# is capped at the newest version the org supports. CI overrides this key via
# -Dsonar.python.version from the sonar-python-version input, so it only affects
# local and IDE (SonarLint) analysis.
sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=tests/**,**/*.pyc
