# Org transfer follow-up (2026-06-19): these keys still target the williaby
# SonarCloud org. Do NOT flip to byronwilliamscpa until the SonarCloud project
# is created/bound under the ByronWilliamsCPA org, or analysis breaks.
sonar.organization=williaby
sonar.projectKey=williaby_pp-security-master
sonar.sources=src
# Versions the SOURCE supports. requires-python is ">=3.11" with no ceiling, so this is
# capped at the newest version the org supports. CI overrides this key via
# -Dsonar.python.version from the sonar-python-version input, so it only affects local and
# IDE (SonarLint) analysis. Keep the two in sync.
sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=tests/**,**/*.pyc
