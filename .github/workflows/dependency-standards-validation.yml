name: Dependency and Standards Validation
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  dep-standards:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
