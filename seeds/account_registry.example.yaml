# Example account registry seed with made-up data only.
#
# The real seed lives OUTSIDE this repository. Point PP_ACCOUNT_REGISTRY_PATH
# (environment or .env) at it. Never commit a real seed.
#
# Each entry maps a stable account key to the owning entity's UUID (issued by the
# entity master, not by this project) and a plain-English display name.
#   - account_key: "pp:" prefix, lowercase, at most the last four digits of any
#     account number (for IBKR: pp:ibkr:<last four of the account id>).
#   - entity_id: personal accounts use the owner's "individual" entity; joint
#     items use a "household" entity.
#   - category: one of Investments, Retirement, Cash, Digital currency,
#     Alternatives.
accounts:
  - account_key: "pp:ibkr:0001"  # pragma: allowlist secret -- account key, not a secret
    entity_id: "11111111-1111-4111-8111-111111111111"
    display_name: "Example Brokerage Account"
    category: "Investments"
  - account_key: "pp:ibkr:0002"  # pragma: allowlist secret -- account key, not a secret
    entity_id: "11111111-1111-4111-8111-111111111111"
    display_name: "Example Retirement Account"
    category: "Retirement"
  - account_key: "pp:bank:0003"  # pragma: allowlist secret -- account key, not a secret
    entity_id: "22222222-2222-4222-8222-222222222222"
    display_name: "Example Joint Checking"
    category: "Cash"
